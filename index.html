<!DOCTYPE html>

    <title>Aquaviva — Gestión Ambiental</title>
    <!-- Guardar token de demo antes de que el router SPA lo pierda -->
    <script>
      (function() {
        var t = new URLSearchParams(window.location.search).get('token');
        if (t) { localStorage.setItem('_aqtoken', t); sessionStorage.setItem('_aqtoken', t); }
      })();
    </script>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
