upload_max_filesize  = 50M
post_max_size        = 55M
max_execution_time   = 120
max_input_time       = 120
memory_limit         = 256M

date.timezone        = America/Bogota

error_reporting      = E_ALL
display_errors       = Off
log_errors           = On
error_log            = /var/log/php_errors.log
